  #card { width: min(720px, 100%); padding: 44px 44px 40px; border-radius: 26px; background: rgba(255,255,255,0.055); backdrop-filter: blur(26px) saturate(160%); -webkit-backdrop-filter: blur(26px) saturate(160%); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 30px 90px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.12); transition: opacity 0.38s ease, transform 0.38s cubic-bezier(0.22,0.61,0.36,1); transform: scale(1); opacity: 1; }

  #type-flash.dissolving { opacity: 0; transition: opacity 0.3s ease; }
  #type-flash.dissolving #type-flash-text { transform: scale(1.1); transition: transform 0.6s ease; }

/* ================================================================
   一、Canvas 四芒星粒子背景
   ================================================================ */
(function initParticles() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0, particles = [], sprite = null;

  function createSprite() {
    const size = 64;
    const off = document.createElement('canvas'); off.width = off.height = size;
    const g = off.getContext('2d'); const cx = size / 2, cy = size / 2;
    const grad = g.createRadialGradient(cx, cy, 0, cx, cy, size / 2);
    grad.addColorStop(0, 'rgba(255, 255, 255, 0.9)'); grad.addColorStop(0.2, 'rgba(200, 220, 255, 0.4)'); grad.addColorStop(1, 'rgba(200, 220, 255, 0)');
    g.fillStyle = grad; g.fillRect(0, 0, size, size);
    g.beginPath();
    const long = size * 0.45, short = size * 0.08;
    g.moveTo(cx, cy - long); g.quadraticCurveTo(cx + short, cy - short, cx + long, cy);
    g.quadraticCurveTo(cx + short, cy + short, cx, cy + long); g.quadraticCurveTo(cx - short, cy + short, cx - long, cy);
    g.quadraticCurveTo(cx - short, cy - short, cx, cy - long);
    g.fillStyle = 'rgba(255, 255, 255, 0.95)'; g.fill();
    return off;
  }

  function buildParticles() {
    const count = Math.min(350, Math.round((W * H) / 8000));
    particles = [];
    for (let i = 0; i < count; i++) {
      particles.push({ x: Math.random() * W, y: Math.random() * H, size: 1.2 + Math.random() * 2.8, vx: (Math.random() - 0.5) * 0.12, vy: -0.05 - Math.random() * 0.15, alpha: 0.15 + Math.random() * 0.6, phase: Math.random() * Math.PI * 2, speed: 0.0004 + Math.random() * 0.0012 });
    }
  }

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); buildParticles();
  }

  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(now - lastTime, 50); lastTime = now;
    ctx.clearRect(0, 0, W, H); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx * dt * 0.06; p.y += p.vy * dt * 0.06; p.phase += p.speed * dt;
      if (p.y < -40) { p.y = H + 40; p.x = Math.random() * W; }
      if (p.x < -40) p.x = W + 40; if (p.x > W + 40) p.x = -40;
      const twinkle = 0.6 + 0.4 * Math.sin(p.phase);
      const drawSize = p.size * 9; 
      ctx.globalAlpha = p.alpha * twinkle; ctx.drawImage(sprite, p.x - drawSize/2, p.y - drawSize/2, drawSize, drawSize);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(loop);
  }
  sprite = createSprite(); resize(); requestAnimationFrame(loop);
  let resizeTimer = null; window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 180); });
})();

      }
    }
    if (particles.length <= 2600 || gap >= 7) break; gap += 0.5;
  }

  typeFlash.classList.add('dissolving');
  dissolveCanvas.width = Math.floor(W * dpr); dissolveCanvas.height = Math.floor(H * dpr);
  dissolveCanvas.style.width = W + 'px'; dissolveCanvas.style.height = H + 'px';
  dctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  let lastFrame = performance.now();
  function frame(now) {
    const dt = Math.min(now - lastFrame, 32); lastFrame = now; const f = dt / 16.67;
    dctx.clearRect(0, 0, W, H); let alive = 0;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i]; if (p.life <= 0) continue; alive++;
      p.x += p.vx * f; p.y += p.vy * f; p.vx *= Math.pow(0.972, f); p.vy *= Math.pow(0.972, f); p.vy -= 0.02 * f;
      p.life -= p.decay * f; if (p.life < 0) p.life = 0;
      dctx.globalAlpha = p.life; dctx.fillStyle = p.color;
      dctx.beginPath(); dctx.arc(p.x, p.y, p.size * (0.35 + 0.65 * p.life), 0, Math.PI * 2); dctx.fill();
    }
    if (alive > 0) requestAnimationFrame(frame);
    else { dctx.clearRect(0, 0, W, H); typeFlash.classList.remove('show', 'dissolving'); typeFlashText.textContent = ''; onComplete(); }
  }
  requestAnimationFrame(frame);
}

function playTypeVideo(type) {
  const info = MBTI_TYPES[type] || {}; const src = info.video || '';
  finished = false; videoStarted = false;
  if (!src) { setTimeout(() => endVideo(), 500); return; }
  video.classList.remove('show'); video.muted = true; video.setAttribute('muted', ''); video.src = src; video.load();
  video.addEventListener('playing', function onPlaying() { videoStarted = true; }, { once: true });
  video.oncanplay = function () {
    video.oncanplay = null; video.classList.add('show');
    const p = video.play();
    if (p && typeof p.catch === 'function') p.catch(() => { if (!finished) endVideo(); });
    clearTimeout(videoFallbackTimer); videoFallbackTimer = setTimeout(() => { if (!videoStarted && !finished) endVideo(); }, 10000);
  };
  video.onerror = function () { if (!finished) setTimeout(() => endVideo(), 600); };
}

function endVideo() {
  if (finished) return; finished = true; clearTimeout(videoFallbackTimer);
  try { video.pause(); } catch (e) {}
  video.classList.remove('show'); setTimeout(() => showResult(currentType), 700);
}
video.addEventListener('ended', endVideo);

/* 计算分数：基于 4 个选项的权重累加 */
function calcType() {
  const score = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
  answers.forEach(ans => { score[ans.dim] += ans.score; });
  
  const dims = [['E', 'I'], ['S', 'N'], ['T', 'F'], ['J', 'P']];
  return dims.map(([left, right]) => {
    if (score[left] > score[right]) return left;
    if (score[right] > score[left]) return right;
    return left; // 极端平票时随便取一个
  }).join('');
}

function showResult(type) {
  const info = MBTI_TYPES[type] || { title: '神秘人格', desc: '暂时还没有对应的描述文案。', sins: {} };
  resultTypeEl.textContent = type;
  resultTitle.textContent = info.title;
  resultDesc.textContent = info.desc;
  
  // 填充扩展信息
  textStrengths.textContent = info.strengths || '暂无数据';
  textWeaknesses.textContent = info.weaknesses || '暂无数据';
  textLove.textContent = info.love || '暂无数据';
  textCareers.textContent = info.careers || '暂无数据';
  
  renderSins(info.sins || {});
  resultLayer.classList.add('show');
  setTimeout(animateSins, 400);
}

function renderSins(sins) {
  sinGrid.innerHTML = '';
  SIN_META.forEach(meta => {
    const raw = Number(sins[meta.key]);
    const value = Number.isFinite(raw) ? Math.max(0, Math.min(100, raw)) : 0;
    const item = document.createElement('div'); item.className = 'sin-item'; item.dataset.value = String(value);
    item.innerHTML = `
      <div class="sin-head">
        <span class="sin-name">${meta.name}<em>${meta.en}</em></span>
        <span class="sin-value">0</span>
      </div>
      <div class="sin-track"><div class="sin-bar" style="background: linear-gradient(90deg, ${meta.color}99, ${meta.color}); box-shadow: 0 0 10px ${meta.color}55;"></div></div>
    `;
    sinGrid.appendChild(item);
  });
}

function animateSins() {
  const items = sinGrid.querySelectorAll('.sin-item');
  items.forEach((item, index) => {
    const target = Number(item.dataset.value) || 0, bar = item.querySelector('.sin-bar'), valueEl = item.querySelector('.sin-value');
    const delay = index * 80, duration = 1100;
    setTimeout(() => { bar.style.width = target + '%'; }, delay);
    const startTime = performance.now();
    function tick(now) {
      const elapsed = now - startTime - delay, t = Math.min(Math.max(elapsed / duration, 0), 1), ease = 1 - Math.pow(1 - t, 3);
      valueEl.textContent = Math.round(target * ease); if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

restartBtn.addEventListener('click', () => { window.location.reload(); });
renderQuestion();
