<style>

  #bg-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .glass-panel { background: rgba(255,255,255,0.055); backdrop-filter: blur(26px) saturate(160%); -webkit-backdrop-filter: blur(26px) saturate(160%); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 30px 90px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.12); }

  #music-toggle { position: fixed; top: 24px; right: 24px; z-index: 10; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: rgba(255,255,255,0.6); transition: all 0.3s ease; }

  .start-desc { font-size: 14.5px; color: rgba(255,255,255,0.5); max-width: 440px; line-height: 1.8; margin-bottom: 50px; letter-spacing: 0.05em; }
  .start-btn { padding: 16px 48px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 15px; letter-spacing: 0.2em; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(10px); }
  .start-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(160,190,255,0.6); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(110,150,255,0.2); }

  .restart-btn { margin-top: 36px; padding: 13px 36px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18); color: #e9e9ee; font-family: inherit; font-size: 13px; letter-spacing: 0.22em; padding-left: 40px; cursor: pointer; transition: all 0.3s ease; }

  @media (max-width: 640px) {

<script>
/* ================================================================
   一、四芒星背景
   ================================================================ */
(function initParticles() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0, particles = [], sprite = null;
  function createSprite() {
    const size = 64; const off = document.createElement('canvas'); off.width = off.height = size;
    const g = off.getContext('2d'); const cx = size / 2, cy = size / 2;
    const grad = g.createRadialGradient(cx, cy, 0, cx, cy, size / 2);
    grad.addColorStop(0, 'rgba(255,255,255,0.9)'); grad.addColorStop(0.2, 'rgba(200,220,255,0.4)'); grad.addColorStop(1, 'rgba(200,220,255,0)');
    g.fillStyle = grad; g.fillRect(0, 0, size, size);
    g.beginPath(); const long = size * 0.45, short = size * 0.08;
    g.moveTo(cx, cy - long); g.quadraticCurveTo(cx + short, cy - short, cx + long, cy);
    g.quadraticCurveTo(cx + short, cy + short, cx, cy + long); g.quadraticCurveTo(cx - short, cy + short, cx - long, cy);
    g.quadraticCurveTo(cx - short, cy - short, cx, cy - long); g.fillStyle = 'rgba(255,255,255,0.95)'; g.fill();
    return off;
  }
  function buildParticles() {
    const count = Math.min(350, Math.round((W * H) / 8000)); particles = [];
    for (let i = 0; i < count; i++) particles.push({ x: Math.random()*W, y: Math.random()*H, size: 1.2+Math.random()*2.8, vx: (Math.random()-0.5)*0.12, vy: -0.05-Math.random()*0.15, alpha: 0.15+Math.random()*0.6, phase: Math.random()*Math.PI*2, speed: 0.0004+Math.random()*0.0012 });
  }
  function resize() { W = window.innerWidth; H = window.innerHeight; canvas.width = Math.floor(W*dpr); canvas.height = Math.floor(H*dpr); canvas.style.width = W+'px'; canvas.style.height = H+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); buildParticles(); }
  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(now-lastTime, 50); lastTime = now;
    ctx.clearRect(0,0,W,H); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i]; p.x += p.vx*dt*0.06; p.y += p.vy*dt*0.06; p.phase += p.speed*dt;
      if (p.y < -40) { p.y = H+40; p.x = Math.random()*W; } if (p.x < -40) p.x = W+40; if (p.x > W+40) p.x = -40;
      const twinkle = 0.6 + 0.4*Math.sin(p.phase); const drawSize = p.size*9;
      ctx.globalAlpha = p.alpha*twinkle; ctx.drawImage(sprite, p.x-drawSize/2, p.y-drawSize/2, drawSize, drawSize);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; requestAnimationFrame(loop);
  }
  sprite = createSprite(); resize(); requestAnimationFrame(loop);
  let resizeTimer = null; window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 180); });
})();

function saveProgress() {
  if (currentIndex < QUESTIONS.length) localStorage.setItem(STORAGE_KEY, JSON.stringify({ index: currentIndex, answers: answerHistory }));
  else localStorage.removeItem(STORAGE_KEY);
}
function checkSavedProgress() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      const data = JSON.parse(saved);
      if (data && typeof data.index === 'number' && Array.isArray(data.answers) && data.index < QUESTIONS.length) {
        startBtn.textContent = '继 续 测 试';
        resumeHint.style.display = 'block';
        resumeHint.textContent = `检测到未完成的进度（已完成 ${data.index} / ${QUESTIONS.length} 题）`;
        currentIndex = data.index; answerHistory = data.answers;
      }
    } catch (e) { localStorage.removeItem(STORAGE_KEY); }
  }
}
checkSavedProgress();

function renderQuestion() {

function handleChoice(choiceKey) {
  const q = QUESTIONS[currentIndex];
  const selected = q[choiceKey.toLowerCase()];
  if (!selected) return;
  answerHistory.push({ dim: selected.dim, score: selected.score });
  currentIndex++;
  if (currentIndex < QUESTIONS.length) {
    saveProgress();
    card.style.opacity = '0'; card.style.transform = 'scale(0.9)';
    setTimeout(() => {
      renderQuestion();
      card.style.transition = 'none'; card.style.opacity = '0'; card.style.transform = 'scale(1.04)'; void card.offsetWidth;
      card.style.transition = ''; card.style.opacity = '1'; card.style.transform = 'scale(1)';
    }, 380);
  } else {
    localStorage.removeItem(STORAGE_KEY); finishQuiz();
  }
}

/* ================================================================
   五、计算（四维 + A/T 身份）
   ================================================================ */
function calcResult() {
  const score = { E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0,A:0,Tb:0 };
  // 注意：T 同时用于 Thinking 和 Turbulent，这里用 Tb 代表 Turbulent
  answerHistory.forEach(ans => {
    const d = ans.dim;
    if (d === 'T' && ans.score >= 0) score.T += ans.score; // 前 28 题的 T 是 Thinking
    else if (d === 'A' || d === 'T') {
      // 身份维度的 T 归入 Tb
      if (d === 'A') score.A += ans.score;
      else score.Tb += ans.score;
    } else if (score[d] !== undefined) score[d] += ans.score;
  });

  // 修正：T 维度在身份题中会被重复计入 Thinking，需要分离
  // 更可靠的方式：根据题目索引区分
  const coreScore = { E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0 };
  const identityScore = { A:0, Tb:0 };
  answerHistory.forEach((ans, idx) => {
    if (idx < 28) {
      coreScore[ans.dim] += ans.score;
    } else {
      if (ans.dim === 'A') identityScore.A += ans.score;
      else if (ans.dim === 'T') identityScore.Tb += ans.score;
    }
  });

  const dims = [['E','I'],['S','N'],['T','F'],['J','P']];
  const type = dims.map(([l,r]) => coreScore[l] >= coreScore[r] ? l : r).join('');
  const subtype = identityScore.A >= identityScore.Tb ? 'A' : 'T';
  return { type, subtype };
}

/* ================================================================
   六、流程
   ================================================================ */
function finishQuiz() {
  const r = calcResult(); currentType = r.type; currentSubtype = r.subtype;
  card.style.opacity = '0'; card.style.transform = 'scale(0.9)';
  quizLayer.style.pointerEvents = 'none';
  setTimeout(() => {
    quizLayer.classList.remove('active');
    if (musicPlaying) { bgm.pause(); musicToggle.classList.add('muted'); musicPlaying = false; }
    playTypeVideo(currentType);
  }, 500);
}

function playTypeVideo(type) {
  const info = MBTI_TYPES[type] || {}; const src = info.video || '';
  finished = false; videoStarted = false;
  if (!src) { setTimeout(() => endVideo(), 500); return; }
  video.classList.remove('show'); video.muted = true; video.setAttribute('muted', ''); video.src = src; video.load();
  video.addEventListener('playing', function onPlaying() { videoStarted = true; }, { once: true });
  video.oncanplay = function () {
    video.oncanplay = null; video.classList.add('show');
    const p = video.play();
    if (p && typeof p.catch === 'function') p.catch(() => { if (!finished) endVideo(); });
    clearTimeout(videoFallbackTimer); videoFallbackTimer = setTimeout(() => { if (!videoStarted && !finished) endVideo(); }, 10000);
  };
  video.onerror = function () { if (!finished) setTimeout(() => endVideo(), 600); };
}

function endVideo() {
  if (finished) return; finished = true; clearTimeout(videoFallbackTimer);
  try { video.pause(); } catch (e) {}
  video.classList.remove('show');
  setTimeout(() => showTypeFlash(), 600);
}
video.addEventListener('ended', endVideo);

function showTypeFlash() {
  const full = `${currentType}-${currentSubtype}`;
  typeFlashText.textContent = full;
  typeFlashSub.textContent = currentSubtype === 'A' ? '坚定型 · 自信、抗压、较少内耗' : '动荡型 · 敏感、追求完美、容易自省';
  typeFlash.classList.add('show');
  setTimeout(() => {
    dissolveType(full, () => { setTimeout(() => showResult(), 200); });
  }, 2200);
}

function dissolveType(text, onComplete) {
  const W = window.innerWidth, H = window.innerHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cx = W / 2, cy = H / 2;
  const fontSize = Math.min(Math.max(44, W * 0.11), 108);
  const spacing = fontSize * 0.08;
  const off = document.createElement('canvas'); off.width = Math.floor(W * dpr); off.height = Math.floor(H * dpr);
  const octx = off.getContext('2d'); octx.scale(dpr, dpr); octx.textAlign = 'left'; octx.textBaseline = 'middle';
  octx.font = `200 ${fontSize}px -apple-system, sans-serif`;
  const chars = Array.from(text), widths = chars.map(ch => octx.measureText(ch).width);
  let totalWidth = 0; chars.forEach((ch, i) => { totalWidth += widths[i]; if (i < chars.length - 1) totalWidth += spacing; });
  const grad = octx.createLinearGradient(cx - totalWidth/2, cy, cx + totalWidth/2, cy);
  grad.addColorStop(0, '#fff'); grad.addColorStop(0.58, '#9fc0ff'); grad.addColorStop(1, '#c9a7ff'); octx.fillStyle = grad;
  let penX = cx - totalWidth / 2;
  chars.forEach((ch, i) => { octx.fillText(ch, penX, cy); penX += widths[i] + spacing; });

  const boxW = totalWidth + 60, boxH = fontSize * 1.6;
  const boxX = Math.max(0, Math.floor(cx - boxW / 2)), boxY = Math.max(0, Math.floor(cy - boxH / 2));
  const boxX2 = Math.min(W, Math.ceil(cx + boxW / 2)), boxY2 = Math.min(H, Math.ceil(cy + boxH / 2));
  const imgData = octx.getImageData(0, 0, off.width, off.height), pixels = imgData.data;

  let particles = [], gap = 3;
  while (true) {
    particles = [];
    for (let ly = boxY; ly < boxY2; ly += gap) {
      for (let lx = boxX; lx < boxX2; lx += gap) {
        const px = Math.floor(lx * dpr), py = Math.floor(ly * dpr);
        if (px >= off.width || py >= off.height) continue;
        const idx = (py * off.width + px) * 4;
        if (pixels[idx + 3] > 100) {
          particles.push({ x: lx, y: ly, vx: (Math.random()-0.5)*2.2, vy: (Math.random()-0.5)*2.2 - 0.5, size: 0.9+Math.random()*1.5, life: 1, decay: 0.01+Math.random()*0.015, color: `rgb(${pixels[idx]},${pixels[idx+1]},${pixels[idx+2]})` });
        }
      }
    }
    if (particles.length <= 3000 || gap >= 8) break; gap += 0.5;
  }

  typeFlash.classList.add('dissolving');
  dissolveCanvas.width = Math.floor(W * dpr); dissolveCanvas.height = Math.floor(H * dpr);
  dissolveCanvas.style.width = W + 'px'; dissolveCanvas.style.height = H + 'px';
  dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  let lastFrame = performance.now();
  function frame(now) {
    const dt = Math.min(now - lastFrame, 32); lastFrame = now; const f = dt / 16.67;
    dctx.clearRect(0, 0, W, H); let alive = 0;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i]; if (p.life <= 0) continue; alive++;
      p.x += p.vx*f; p.y += p.vy*f; p.vx *= Math.pow(0.972, f); p.vy *= Math.pow(0.972, f); p.vy -= 0.02*f;
      p.life -= p.decay*f; if (p.life < 0) p.life = 0;
      dctx.globalAlpha = p.life; dctx.fillStyle = p.color;
      dctx.beginPath(); dctx.arc(p.x, p.y, p.size*(0.35+0.65*p.life), 0, Math.PI*2); dctx.fill();
    }
    if (alive > 0) requestAnimationFrame(frame);
    else { dctx.clearRect(0,0,W,H); typeFlash.classList.remove('show','dissolving'); typeFlashText.textContent = ''; typeFlashSub.textContent = ''; onComplete(); }
  }
  requestAnimationFrame(frame);
}

/* ================================================================
   七、结果页
   ================================================================ */
function showResult() {
  const info = MBTI_TYPES[currentType] || {};
  const fullType = `${currentType}-${currentSubtype}`;
  document.getElementById('result-type').textContent = fullType;
  document.getElementById('result-subtype').textContent = currentSubtype === 'A' ? '基础类型 ' + currentType + ' · 坚定型（Assertive）' : '基础类型 ' + currentType + ' · 动荡型（Turbulent）';
  document.getElementById('result-title').textContent = info.title || '';
  document.getElementById('result-desc').textContent = info.desc || '';
  document.getElementById('text-strengths').textContent = info.strengths || '';
  document.getElementById('text-weaknesses').textContent = info.weaknesses || '';
  document.getElementById('text-love').textContent = info.love || '';
  document.getElementById('text-careers').textContent = info.careers || '';
  document.getElementById('text-comm').textContent = info.comm || '';
  document.getElementById('text-growth').textContent = info.growth || '';
  renderSins(info.sins || {});
  resultLayer.classList.add('show');
  setTimeout(animateSins, 400);
}

function renderSins(sins) {
  const sinGrid = document.getElementById('sin-grid'); sinGrid.innerHTML = '';
  SIN_META.forEach(meta => {
    const val = Math.max(0, Math.min(100, Number(sins[meta.key]) || 0));
    const item = document.createElement('div'); item.className = 'sin-item'; item.dataset.value = String(val);
    item.innerHTML = `<div class="sin-head"><span class="sin-name">${meta.name}<em>${meta.en}</em></span><span class="sin-value">0</span></div><div class="sin-track"><div class="sin-bar" style="background: linear-gradient(90deg, ${meta.color}99, ${meta.color}); box-shadow: 0 0 10px ${meta.color}55;"></div></div>`;
    sinGrid.appendChild(item);
  });
}

function animateSins() {
  document.querySelectorAll('.sin-item').forEach((item, index) => {
    const target = Number(item.dataset.value) || 0, bar = item.querySelector('.sin-bar'), valEl = item.querySelector('.sin-value');
    const delay = index * 60, duration = 1000;
    setTimeout(() => { bar.style.width = target + '%'; }, delay);
    const start = performance.now();
    function tick(now) {
      const t = Math.min(Math.max((now - start - delay) / duration, 0), 1);
      valEl.textContent = Math.round(target * (1 - Math.pow(1 - t, 3)));
      if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

restartBtn.addEventListener('click', () => { window.location.reload(); });
</script>
